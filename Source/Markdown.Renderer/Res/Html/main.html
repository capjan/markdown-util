<!DOCTYPE html>

<html data-theme="auto">
<head>
    <title>%%TITLE%%</title>
    <meta charset="utf-8">
    <meta name="description" content="%%DESCRIPTION%%">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            const savedTheme = localStorage.getItem("mdu-theme");
            if (["auto", "light", "dark"].includes(savedTheme)) {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch { }
    </script>

    </button>

        <kbd id="search-shortcut">⌘ K</kbd>

%%MEDIA_SETTINGS_BUTTON%%
    <button class="theme-toggle" id="theme-toggle" type="button">
        <svg class="theme-icon-auto" viewBox="0 0 20 20" aria-hidden="true" focusable="false">

        <ul class="search-results" id="search-results" aria-label="Search results"></ul>
    </div>
</dialog>
%%MEDIA_SETTINGS_DIALOG%%
<script>
(() => {
    const root = document.documentElement;
    const themeToggle = document.getElementById("theme-toggle");
    const themeLabel = document.getElementById("theme-label");
    const themes = ["auto", "light", "dark"];
    const themeNames = { auto: "Auto", light: "Light", dark: "Dark" };

    const updateThemeLabel = () => {
        const currentTheme = root.dataset.theme;
        const nextTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
        themeLabel.textContent = themeNames[currentTheme];
        themeToggle.title = `Darstellung: ${themeNames[currentTheme]} (klicken für ${themeNames[nextTheme]})`;
        themeToggle.setAttribute("aria-label", `Darstellung: ${themeNames[currentTheme]}. Klicken, um auf ${themeNames[nextTheme]} zu wechseln.`);
    };

    updateThemeLabel();
    themeToggle.addEventListener("click", () => {
        const currentTheme = root.dataset.theme;
        const nextTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
        root.dataset.theme = nextTheme;
        try {
            localStorage.setItem("mdu-theme", nextTheme);
        } catch { }
        updateThemeLabel();
    });

    const layout = document.getElementById("site-layout");
    const toggle = document.getElementById("navigation-toggle");
    const backdrop = document.getElementById("sidebar-backdrop");
    const navigation = document.getElementById("site-navigation");
    const breakpoint = window.matchMedia("(max-width: 760px)");
    const sidebarPreferenceKey = "mdu-sidebar-collapsed";
    const isDesktopSidebarCollapsed = () => {
        try {
            return sessionStorage.getItem(sidebarPreferenceKey) === "true";
        } catch {
            return false;
        }
    };
    const setDesktopSidebarCollapsed = (collapsed) => {
        try {
            sessionStorage.setItem(sidebarPreferenceKey, String(collapsed));
        } catch { }
    };
    let isOpen = !breakpoint.matches && !isDesktopSidebarCollapsed();

    const setOpen = (open) => {
        isOpen = open;
        layout.classList.toggle("sidebar-open", open && breakpoint.matches);
        layout.classList.toggle("sidebar-collapsed", !open && !breakpoint.matches);
        toggle.setAttribute("aria-expanded", String(open));

        if (open && breakpoint.matches) {
            navigation.querySelector("a")?.focus();
        } else if (!open && navigation.contains(document.activeElement)) {
            toggle.focus();
        }
    };

    setOpen(isOpen);
    toggle.addEventListener("click", () => {
        const open = !isOpen;
        setOpen(open);
        if (!breakpoint.matches) setDesktopSidebarCollapsed(!open);
    });

    const currentPage = navigation.querySelector('.site-nav-link[aria-current="page"]');
    navigation.querySelectorAll(".site-nav-toggle").forEach((navToggle) => {
        const children = document.getElementById(navToggle.getAttribute("aria-controls"));
        const pageLink = navToggle.parentElement.querySelector(".site-nav-link");
        const storageKey = `mdu-nav-expanded:${new URL(pageLink.href).pathname}`;
        const isCurrentPage = pageLink === currentPage;
        const containsCurrentPage = currentPage && children.contains(currentPage);
        let savedState;
        try {
            savedState = sessionStorage.getItem(storageKey);
        } catch { }

        const setExpanded = (expanded) => {
            navToggle.setAttribute("aria-expanded", String(expanded));
            navToggle.setAttribute("aria-label", `${expanded ? "Collapse" : "Expand"} ${pageLink.textContent.trim()}`);
            children.hidden = !expanded;
        };

        const isExpandedByDefault = navToggle.getAttribute("aria-expanded") === "true";
        const shouldExpand = isCurrentPage || containsCurrentPage ||
            (savedState === null ? isExpandedByDefault : savedState === "true");
        setExpanded(shouldExpand);
        if ((isCurrentPage || containsCurrentPage) && savedState !== "true") {
            try {
                sessionStorage.setItem(storageKey, "true");
            } catch { }
        }

        navToggle.addEventListener("click", () => {
            const expanded = navToggle.getAttribute("aria-expanded") !== "true";
            setExpanded(expanded);
            try {
                sessionStorage.setItem(storageKey, String(expanded));
            } catch { }
        });
    });

    backdrop.addEventListener("click", () => setOpen(false));
    navigation.addEventListener("click", (event) => {
        if (breakpoint.matches && event.target.closest("a")) setOpen(false);
    });
    document.addEventListener("keydown", (event) => {
        if (breakpoint.matches && isOpen && event.key === "Escape") setOpen(false);
    });
    breakpoint.addEventListener("change", (event) =>
        setOpen(!event.matches && !isDesktopSidebarCollapsed()));
})();
</script>
<script>
(() => {
    const toc = document.getElementById("on-this-page");
    if (!toc) return;

    const links = Array.from(toc.querySelectorAll(".toc-link"));
    const headings = links
        .map((link) => ({ link, heading: document.getElementById(link.hash.slice(1)) }))
        .filter((item) => item.heading);
    const currentLabel = toc.querySelector(".toc-current-label");
    const currentButton = toc.querySelector(".toc-current");
    const progressIndicators = toc.querySelectorAll(".toc-progress-value");
    const backToTop = toc.querySelector(".toc-back-to-top");
    let scrollFrame = 0;

    const setActiveHeading = (activeHeading) => {
        for (const item of headings) {
            const isActive = item === activeHeading;
            item.link.classList.toggle("is-active", isActive);
            if (isActive) item.link.setAttribute("aria-current", "location");
            else item.link.removeAttribute("aria-current");
        }

        if (currentLabel && activeHeading) {
            currentLabel.textContent = activeHeading.link.textContent;
            currentButton.setAttribute("aria-label", `On this Page: ${currentLabel.textContent}`);
        }
    };

    const updateOnScroll = () => {
        scrollFrame = 0;
        const activeHeading = [...headings].reverse().find((item) => item.heading.getBoundingClientRect().top <= 140) ?? headings[0];
        if (activeHeading) setActiveHeading(activeHeading);

        const scrollableHeight = document.documentElement.scrollHeight - window.innerHeight;
        const pageProgress = scrollableHeight > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollableHeight)) : 0;
        for (const indicator of progressIndicators) {
            indicator.style.setProperty("stroke-dashoffset", String(50.265 * (1 - pageProgress)));
        }
        if (backToTop) backToTop.hidden = window.scrollY < 300;
    };

    const scheduleScrollUpdate = () => {
        if (!scrollFrame) scrollFrame = window.requestAnimationFrame(updateOnScroll);
    };

    currentButton?.addEventListener("click", () => {
        const expanded = currentButton.getAttribute("aria-expanded") !== "true";
        currentButton.setAttribute("aria-expanded", String(expanded));
        toc.classList.toggle("is-expanded", expanded);
    });

    toc.querySelector(".toc-nav")?.addEventListener("click", (event) => {
        if (event.target.closest(".toc-link")) {
            currentButton?.setAttribute("aria-expanded", "false");
            toc.classList.remove("is-expanded");
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && toc.classList.contains("is-expanded")) {
            currentButton.setAttribute("aria-expanded", "false");
            toc.classList.remove("is-expanded");
            currentButton.focus();
        }
    });

    window.addEventListener("scroll", scheduleScrollUpdate, { passive: true });
    window.addEventListener("resize", scheduleScrollUpdate);
    scheduleScrollUpdate();
})();
</script>
<script>
(() => {
    const resetTimers = new WeakMap();

    const copyText = async (text) => {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch {
            const field = document.createElement("textarea");
            field.value = text;
            field.setAttribute("readonly", "");
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.append(field);
            field.select();
            let copied = false;
            try {
                copied = document.execCommand("copy");
            } catch { }
            field.remove();
            return copied;
        }
    };

    document.addEventListener("click", async (event) => {
        const button = event.target.closest(".code-block-copy");
        if (!button) return;

        const code = button.closest(".code-block")?.querySelector("pre code");
        if (!code) return;

        const copied = await copyText(code.textContent ?? "");
        const label = button.querySelector("span");
        clearTimeout(resetTimers.get(button));
        label.textContent = copied ? "Copied" : "Copy failed";
        button.setAttribute("aria-label", copied ? "Copied to clipboard" : "Could not copy code");
        button.title = copied ? "Copied to clipboard" : "Could not copy code";
        button.classList.toggle("is-copied", copied);
        button.classList.toggle("is-failed", !copied);
        resetTimers.set(button, setTimeout(() => {
            label.textContent = "Copy";
            button.setAttribute("aria-label", "Copy code");
            button.title = "Copy code";
            button.classList.remove("is-copied");
            button.classList.remove("is-failed");
        }, 1500));
    });
})();
</script>
