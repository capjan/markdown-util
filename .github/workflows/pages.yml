name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'Source/Markdown.Renderer/Res/Css/main.css'
      - 'Source/StaticCode.Highlighter/Res/Css/Highlight.css'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Render and deploy
        id: deployment
        uses: capjan/markdown-util-action@v1
        with:
          docs-path: Docs
          edit-page-root: https://github.com/capjan/markdown-util/edit/main/Docs
