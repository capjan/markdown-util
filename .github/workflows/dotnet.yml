name: .NET
on:
  pull_request:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: dotnet test MarkdownUtils.sln --configuration Release

    - name: Lint Documentation
      run: dotnet run --project Source/MarkdownUtil/MarkdownUtil.csproj --configuration Release --no-build -- lint ./Docs

  native-aot-smoke:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

    - name: Publish Native AOT executable
      run: dotnet publish Source/MarkdownUtil/MarkdownUtil.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishAot=true -warnaserror:IL2026,IL2104,IL3050,IL3053 --output "$RUNNER_TEMP/mdu-publish"

    - name: Smoke test native commands
      run: |
        "$RUNNER_TEMP/mdu-publish/mdu" lint ./Docs --format json
        "$RUNNER_TEMP/mdu-publish/mdu" render ./Docs "$RUNNER_TEMP/mdu-site"

        fixture="$RUNNER_TEMP/mdu-fix-smoke"
        mkdir -p "$fixture/Guide/Deep"
        cat > "$fixture/README.md" <<'EOF'
        # Docs

        [Guide](Guide/index.md)
        EOF
        cat > "$fixture/.pages" <<'EOF'
        arrange:
          - README.md
          - Guide
        EOF
        cat > "$fixture/Guide/index.md" <<'EOF'
        ---
        title: Overview
        ---
        # Guide
        EOF
        cat > "$fixture/Guide/Deep/Topic.md" <<'EOF'
        # Topic
        EOF
        "$RUNNER_TEMP/mdu-publish/mdu" fix "$fixture"
        grep -q 'order: 1' "$fixture/Guide/README.md"
