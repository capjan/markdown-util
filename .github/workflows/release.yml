name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Calculate release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      tag: ${{ steps.version.outputs.tag }}
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Ignore tags from pending draft releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r draft_tag; do
            if [[ -n "$draft_tag" ]]; then
              git tag --delete "$draft_tag"
            fi
          done < <(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"

          if [[ "$latest_tag" == "v2.6.2" ]]; then
            release_tag="$(git cliff --bumped-version --bump major)"
          else
            release_tag="$(git cliff --bumped-version)"
          fi

          if [[ "$release_tag" == "$latest_tag" ]]; then
            echo "No release-worthy Conventional Commits after $latest_tag." >&2
            exit 1
          fi

          package_version="${release_tag#v}"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag"
          echo "Package version: $package_version"

      - name: Generate release notes
        env:
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git cliff --tag "$RELEASE_TAG" --strip all "$LATEST_TAG..HEAD" --output "$RUNNER_TEMP/release-notes.md"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  test:
    name: Test
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test MarkdownUtils.sln --configuration Release

  build-native:
    name: Build ${{ matrix.rid }}
    needs: [prepare-release, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Publish Native AOT executable
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RID: ${{ matrix.rid }}
        run: dotnet publish Source/MarkdownUtil/MarkdownUtil.csproj --configuration Release --runtime $env:RID --self-contained true -p:PublishAot=true -warnaserror:IL2026,IL2104,IL3050 "-p:Version=$env:PACKAGE_VERSION" --output "$env:RUNNER_TEMP/publish"

      - name: Prepare executable archive contents
        shell: pwsh
        run: |
          $archiveContents = "$env:RUNNER_TEMP/release-files"
          New-Item -ItemType Directory -Force "$archiveContents/licenses" | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item "$env:RUNNER_TEMP/publish/mdu.exe" $archiveContents
          } else {
            Copy-Item "$env:RUNNER_TEMP/publish/mdu" $archiveContents
          }
          Copy-Item -Path README.md, LICENSE -Destination $archiveContents
          Copy-Item -Path Source/StaticCode.Icons/THIRD-PARTY-NOTICES.md -Destination $archiveContents
          Copy-Item -Path Source/StaticCode.Icons/Res/dashboard-icons.LICENSE -Destination "$archiveContents/licenses"

      - name: Archive Unix executable
        if: runner.os != 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RID: ${{ matrix.rid }}
        run: tar -czf "$env:RUNNER_TEMP/mdu-$env:PACKAGE_VERSION-$env:RID.tar.gz" -C "$env:RUNNER_TEMP/release-files" mdu README.md LICENSE THIRD-PARTY-NOTICES.md licenses

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RID: ${{ matrix.rid }}
        run: Compress-Archive -Path "$env:RUNNER_TEMP/release-files/*" -DestinationPath "$env:RUNNER_TEMP/mdu-$env:PACKAGE_VERSION-$env:RID.zip"

      - name: Upload executable archive
        uses: actions/upload-artifact@v4
        with:
          name: mdu-${{ matrix.rid }}
          path: ${{ runner.temp }}/mdu-${{ needs.prepare-release.outputs.package_version }}-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Pack, publish, and create release
    needs: [prepare-release, test, build-native]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: dotnet pack Source/MarkdownUtil/MarkdownUtil.csproj --configuration Release --output artifacts/packages -p:Version="$PACKAGE_VERSION"

      - name: Download native executable archives
        uses: actions/download-artifact@v4
        with:
          pattern: mdu-*
          path: artifacts/native
          merge-multiple: true

      - name: Validate native release assets and generate checksums
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: |
          expected=(
            "mdu-$PACKAGE_VERSION-linux-x64.tar.gz"
            "mdu-$PACKAGE_VERSION-win-x64.zip"
            "mdu-$PACKAGE_VERSION-osx-x64.tar.gz"
            "mdu-$PACKAGE_VERSION-osx-arm64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "artifacts/native/$asset" ]]; then
              echo "Missing native release asset: $asset" >&2
              exit 1
            fi
          done
          actual_count=$(find artifacts/native -maxdepth 1 -type f | wc -l)
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} native archives, found $actual_count." >&2
            exit 1
          fi
          (cd artifacts/native && sha256sum "${expected[@]}" > SHA256SUMS)

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Validate NuGet publisher
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Set NUGET_USER to the NuGet.org profile name in repository Actions secrets." >&2
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Create or resume draft GitHub release
        id: github-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" == "true" ]]; then
              gh release upload "$RELEASE_TAG" artifacts/native/* --clobber
              gh release edit "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes/release-notes.md"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release $RELEASE_TAG is already published."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes/release-notes.md" artifacts/native/*
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish GitHub release
        if: steps.github-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
